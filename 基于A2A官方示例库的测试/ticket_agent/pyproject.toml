[project]
name = "ticket_agent"
version = "0.1.0"
description = "Python A2A agent that queries 12306 train tickets via MCP"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk>=0.3.3,<1.0.0",
    "click>=8.2.0",
    "langchain-deepseek>=0.1.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.4.5",
    "mcp>=1.5.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]
